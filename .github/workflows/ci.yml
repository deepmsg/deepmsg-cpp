name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev wget
          # clang 18 (Ubuntu default) cannot see std::expected with libstdc++ 13;
          # clang 20 defines __cpp_concepts=202002 so <expected> is enabled.
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 20
          sudo apt-get install -y clang-20 clang-tidy-20 clang-format-20

      # Ubuntu 24.04 ships CMake 3.28; Aeron 1.54.0 requires 3.30.
      - name: CMake >= 3.30
        run: |
          curl -sSL -o /tmp/cmake.tar.gz https://cmake.org/files/v3.31/cmake-3.31.6-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          echo "/opt/cmake-3.31.6-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The reference `aeron-all` jar is built through the pinned submodule's
      # Gradle wrapper, which downloads gradle-9.8.2-all.zip with a 10 s network
      # timeout and zero retries. Cache the distribution and warm it with
      # retries so a slow runner does not fail the gate.
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('third_party/aeron/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Warm Gradle wrapper (retry)
        run: |
          cd third_party/aeron
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version; then
              exit 0
            fi
            echo "gradle wrapper attempt $attempt failed; retrying" >&2
            sleep 20
          done
          exit 1

      - name: Fetch SBE tool
        run: scripts/fetch-sbe.sh

      - name: Gate (gcc debug+release, clang-20 debug)
        run: scripts/check.sh debug release debug-clang
