name: ci

on:
  # A branch push and its pull request are the same tree; running both doubles
  # the load and, when one runner hangs (measured: a `push` run of A6c sat in
  # `Gate` for over an hour while the identical `pull_request` run finished in
  # 14 minutes), the duplicate hides the result. `main` still runs on push so a
  # merge is gated after the fact.
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    # The gate (debug + release + debug-clang) was ~14 minutes before the
    # cluster scenario table landed; the same three presets now run that
    # suite too and measured 26.3 minutes (2026-11-17, #61), after which the
    # first run with the table (#62) reached this limit while still in the
    # final clang-tidy step. 60 minutes keeps the property the limit is for —
    # a hung interop case (a reference archive that never accepts a client
    # waits 60 s per case) still fails the job instead of sitting for hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev wget
          # clang 18 (Ubuntu default) cannot see std::expected with libstdc++ 13;
          # clang 20 defines __cpp_concepts=202002 so <expected> is enabled.
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 20
          sudo apt-get install -y clang-20 clang-tidy-20 clang-format-20

      # Ubuntu 24.04 ships CMake 3.28; Aeron 1.54.0 requires 3.30.
      # Kitware publishes the same tarball on its GitHub release, which is what
      # this fetches: cmake.org's certificate expired on 2026-11-15 and curl
      # refuses it (exit 60) until the site is reissued.
      - name: CMake >= 3.30
        run: |
          curl -sSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          echo "/opt/cmake-3.31.6-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The reference `aeron-all` jar is built through the pinned submodule's
      # Gradle wrapper, which downloads gradle-9.8.2-all.zip with a 10 s network
      # timeout and zero retries. Cache the distribution and warm it with
      # retries so a slow runner does not fail the gate.
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('third_party/aeron/gradle/wrapper/gradle-wrapper.properties') }}

      # Artifacts the submodule's build resolves (its `buildSrc` plugins among
      # them). Maven Central answers 429 to a share of the runners (2026-11-27:
      # the nightly fuzz died on `moshi-kotlin`); a cache hit keeps the gate off
      # the network, and the warm step below retries the resolution.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-deps-${{ hashFiles('third_party/aeron/gradle/wrapper/gradle-wrapper.properties', 'third_party/aeron/gradle/libs.versions.toml', 'third_party/aeron/buildSrc/**', 'third_party/aeron/build.gradle', 'third_party/aeron/settings.gradle') }}
          restore-keys: |
            gradle-deps-

      # `./gradlew --version` only fetches the distribution; the resolution the
      # build actually needs happens on `:aeron-all:assemble`, so warm that with
      # the retries no Gradle invocation has of its own.
      - name: Warm Gradle (retry)
        run: |
          cd third_party/aeron
          for attempt in 1 2 3 4 5; do
            if ./gradlew --no-daemon --console=plain --quiet \
                :aeron-all:assemble --exclude-task javadoc --exclude-task check; then
              exit 0
            fi
            echo "gradle resolution attempt $attempt failed; retrying" >&2
            sleep 20
          done
          exit 1

      # The SBE jar is 1 MB and Maven Central rate-limits the runners (2026-11-18:
      # 429 twice in one morning); a cache hit keeps the gate off the network.
      - name: Cache SBE tool
        uses: actions/cache@v4
        with:
          path: third_party/sbe-tool
          key: sbe-tool-1.42.0

      - name: Fetch SBE tool
        run: scripts/fetch-sbe.sh

      - name: Gate (gcc debug+release, clang-20 debug)
        run: scripts/check.sh debug release debug-clang

  # The DPDK media, compiled in. A job of its own so the default gate above
  # keeps running on a machine with no `libdpdk-dev`; the `dpdk` preset is the
  # only one that turns `AXC_WITH_DPDK` on.
  dpdk:
    runs-on: ubuntu-24.04
    # 1017 cases, 17.5 minutes with the cluster scenario table (2026-11-17);
    # 45 leaves the same headroom the gate has.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev libdpdk-dev wget
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 20
          sudo apt-get install -y clang-20 clang-tidy-20 clang-format-20

      - name: CMake >= 3.30
        run: |
          curl -sSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          echo "/opt/cmake-3.31.6-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('third_party/aeron/gradle/wrapper/gradle-wrapper.properties') }}

      # Artifacts the submodule's build resolves (its `buildSrc` plugins among
      # them). Maven Central answers 429 to a share of the runners (2026-11-27:
      # the nightly fuzz died on `moshi-kotlin`); a cache hit keeps the gate off
      # the network, and the warm step below retries the resolution.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-deps-${{ hashFiles('third_party/aeron/gradle/wrapper/gradle-wrapper.properties', 'third_party/aeron/gradle/libs.versions.toml', 'third_party/aeron/buildSrc/**', 'third_party/aeron/build.gradle', 'third_party/aeron/settings.gradle') }}
          restore-keys: |
            gradle-deps-

      # `./gradlew --version` only fetches the distribution; the resolution the
      # build actually needs happens on `:aeron-all:assemble`, so warm that with
      # the retries no Gradle invocation has of its own.
      - name: Warm Gradle (retry)
        run: |
          cd third_party/aeron
          for attempt in 1 2 3 4 5; do
            if ./gradlew --no-daemon --console=plain --quiet \
                :aeron-all:assemble --exclude-task javadoc --exclude-task check; then
              exit 0
            fi
            echo "gradle resolution attempt $attempt failed; retrying" >&2
            sleep 20
          done
          exit 1

      # The SBE jar is 1 MB and Maven Central rate-limits the runners (2026-11-18:
      # 429 twice in one morning); a cache hit keeps the gate off the network.
      - name: Cache SBE tool
        uses: actions/cache@v4
        with:
          path: third_party/sbe-tool
          key: sbe-tool-1.42.0

      - name: Fetch SBE tool
        run: scripts/fetch-sbe.sh

      - name: Gate (debug + DPDK)
        run: scripts/check.sh dpdk
