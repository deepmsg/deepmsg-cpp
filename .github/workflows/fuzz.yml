name: fuzz

# The fuzz targets have two tiers, and this workflow owns the one the PR gate
# cannot: a random search.
#
# - `ci.yml`'s gate runs `scripts/check.sh`, which registers every target's
#   standalone replay with ctest (its seeds, the goldens, their truncations
#   and one-byte flips) under the ordinary presets.
# - this workflow runs the same `scripts/run-fuzz.sh` a developer uses, with
#   libFuzzer + ASan/UBSan, 120 s per target, on a schedule.
#
# The corpus (`build/fuzz/corpus/`) is kept in the Actions cache between
# nights: libFuzzer only keeps inputs that add coverage, so a restored corpus
# lets the next run explore past what has already been found. The key carries
# the run id and attempt (a rerun reuses the run id and cannot overwrite an
# existing cache), and the `fuzz-corpus-` prefix restores the most recent one.
# No `cmin` is applied; `scripts/run-fuzz.sh` logs each target's corpus size
# and this job logs the totals, which is the reading the size decision waits
# on.

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev wget
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s 20
          sudo apt-get install -y clang-20

      # Ubuntu 24.04 ships CMake 3.28; Aeron 1.54.2 requires 3.30. Same
      # Kitware release `ci.yml` uses (cmake.org's certificate expired on
      # 2026-11-15 and curl refuses it until the site is reissued).
      - name: CMake >= 3.30
        run: |
          curl -sSL -o /tmp/cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          echo "/opt/cmake-3.31.6-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The SBE jar is 1 MB and Maven Central rate-limits the runners (2026-11-18:
      # 429 twice in one morning); a cache hit keeps the job off the network.
      - name: Cache SBE tool
        uses: actions/cache@v4
        with:
          path: third_party/sbe-tool
          key: sbe-tool-1.42.0

      - name: Fetch SBE tool
        run: scripts/fetch-sbe.sh

      # The archive codecs and the reference `aeron-all` jar are Gradle build
      # products of the pinned submodule, so a fuzz build configures that
      # Gradle build before it compiles anything. `ci.yml` warms the wrapper
      # distribution for the same reason; here the resolved dependencies are
      # kept too, because resolving them is what failed (2026-11-27: Maven
      # Central answered 429 for `moshi-kotlin` and the job died in
      # `:buildSrc` before a single target ran).
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('third_party/aeron/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-deps-${{ hashFiles('third_party/aeron/gradle/wrapper/gradle-wrapper.properties', 'third_party/aeron/gradle/libs.versions.toml', 'third_party/aeron/buildSrc/**', 'third_party/aeron/build.gradle', 'third_party/aeron/settings.gradle') }}
          # A newer submodule may want artifacts an older cache does not have;
          # Gradle fetches only those, so an old cache is still worth more than
          # a cold one.
          restore-keys: |
            gradle-deps-

      # The task `cmake --build` runs anyway, in a loop that retries: a
      # rate-limited resolution lands here, where it is retried, instead of
      # halfway through the build. The assembled jar is what CMake looks for,
      # so the build then skips its own Gradle invocation.
      - name: Warm Gradle (retry)
        run: |
          cd third_party/aeron
          for attempt in 1 2 3 4 5; do
            if ./gradlew --no-daemon --console=plain --quiet \
                :aeron-all:assemble --exclude-task javadoc --exclude-task check; then
              exit 0
            fi
            echo "gradle resolution attempt $attempt failed; retrying" >&2
            sleep 20
          done
          exit 1

      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-

      - name: Corpus size before
        run: |
          du -sh build/fuzz/corpus || echo "build/fuzz/corpus: 0 (nothing restored)"
          du -sb build/fuzz/corpus || true

      # `setarch -R`: ASan's shadow range cannot be mapped when the kernel
      # hands out addresses with too many random bits (the runner's
      # `vm.mmap_rnd_bits`; seen locally as "Shadow memory range interleaves
      # with an existing memory mapping"). Disabling ASLR is the same
      # workaround the asan preset uses; it does not change the search.
      - name: Every target, 120 seconds
        run: setarch -R scripts/run-fuzz.sh --duration 120

      - name: Save the corpus
        # A crash must not throw away what the earlier targets found; and a
        # cache failure is not a fuzz failure, so the job stays green.
        if: always() && hashFiles('build/fuzz/corpus/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Corpus size after
        if: always()
        run: |
          du -sh build/fuzz/corpus || true
          du -sb build/fuzz/corpus || true
          du -sh build/fuzz/corpus/* 2>/dev/null | sort -h || true

      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes
          if-no-files-found: ignore
